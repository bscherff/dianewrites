<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
  <defs>
    <!-- Warm parchment gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F0E4DE"/>
      <stop offset="100%" stop-color="#DEC8BF"/>
    </linearGradient>
    <!-- Subtle spine shadow on left edge -->
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2C2420" stop-opacity="0.18"/>
      <stop offset="12%" stop-color="#2C2420" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cover background -->
  <rect width="300" height="450" fill="url(#bg)"/>

  <!-- Spine shadow -->
  <rect width="300" height="450" fill="url(#spine)"/>

  <!-- Decorative border inset -->
  <rect x="14" y="14" width="272" height="422" fill="none" stroke="#C4856A" stroke-width="1" opacity="0.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#C4856A" stroke-width="0.4" opacity="0.4"/>

  <!-- Top ornamental rule -->
  <line x1="40" y1="62" x2="260" y2="62" stroke="#C4856A" stroke-width="0.8" opacity="0.7"/>

  <!-- Floral ornament -->
  <text x="150" y="90" font-family="Georgia, serif" font-size="22" fill="#C4856A" text-anchor="middle" opacity="0.75">❧</text>

  <!-- Title: Girls to Pearls -->
  <text x="150" y="148" font-family="Georgia, serif" font-size="28" font-style="italic" font-weight="bold"
        fill="#2C2420" text-anchor="middle" letter-spacing="0.5">Girls to</text>
  <text x="150" y="184" font-family="Georgia, serif" font-size="28" font-style="italic" font-weight="bold"
        fill="#2C2420" text-anchor="middle" letter-spacing="0.5">Pearls</text>

  <!-- Thin rule under title -->
  <line x1="80" y1="200" x2="220" y2="200" stroke="#C4856A" stroke-width="0.8"/>

  <!-- Subtitle / setting line -->
  <text x="150" y="232" font-family="Georgia, serif" font-size="11" font-style="italic"
        fill="#8C7B76" text-anchor="middle" letter-spacing="0.3">Savannah, Georgia — 1950s</text>

  <!-- Decorative pearl string illustration (3 circles) -->
  <circle cx="138" cy="290" r="5.5" fill="none" stroke="#C4856A" stroke-width="1.2" opacity="0.6"/>
  <circle cx="150" cy="286" r="6.5" fill="#FAF7F2" stroke="#C4856A" stroke-width="1.2" opacity="0.8"/>
  <circle cx="162" cy="290" r="5.5" fill="none" stroke="#C4856A" stroke-width="1.2" opacity="0.6"/>
  <line x1="112" y1="290" x2="132" y2="290" stroke="#C4856A" stroke-width="0.8" opacity="0.5"/>
  <line x1="168" y1="290" x2="188" y2="290" stroke="#C4856A" stroke-width="0.8" opacity="0.5"/>

  <!-- "Coming Soon" badge -->
  <rect x="80" y="340" width="140" height="30" rx="2" fill="none" stroke="#C4856A" stroke-width="0.8" opacity="0.6"/>
  <text x="150" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"
        fill="#8C7B76" text-anchor="middle" letter-spacing="2" font-weight="300">COMING SOON</text>

  <!-- Author name -->
  <line x1="40" y1="400" x2="260" y2="400" stroke="#C4856A" stroke-width="0.8" opacity="0.7"/>
  <text x="150" y="424" font-family="Georgia, serif" font-size="13" font-style="italic"
        fill="#4A3F3A" text-anchor="middle" letter-spacing="0.3">Diane Hagan Scherff</text>
</svg>
